name: Release Prebuilt Game

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Copia il codice del repository
      uses: actions/checkout@v4

    - name: Prepara i file e crea lo ZIP
      shell: pwsh
      run: |
        # Crea la cartella di rilascio
        New-Item -ItemType Directory -Force -Path release_folder
        
        # Copia l'eseguibile e le DLL
        Copy-Item "build/TinyTillers.exe" -Destination "release_folder/"
        Copy-Item "libenet-7.dll" -Destination "release_folder/"
        Copy-Item "glfw3.dll" -Destination "release_folder/"
        Copy-Item "libgcc_s_seh-1.dll" -Destination "release_folder/"
        Copy-Item "libstdc++-6.dll" -Destination "release_folder/"
        Copy-Item "libwinpthread-1.dll" -Destination "release_folder/"
        
        # Copia la cartella assets
        Copy-Item "assets" -Destination "release_folder/" -Recurse
        
        # Comprime in ZIP usando PowerShell nativo
        Compress-Archive -Path "release_folder\*" -DestinationPath "TinyTillers-Windows.zip" -Force

    - name: Crea la Release su GitHub e carica lo ZIP
      uses: softprops/action-gh-release@v1
      with:
        files: TinyTillers-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}