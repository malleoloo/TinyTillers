name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
    - name: Copia il codice del repository
      uses: actions/checkout@v4

    - name: Configura MSYS2 e Toolchain MinGW
      uses: msys2/setup-msys2@v2
      with:
        msystem: UCRT64
        update: true
        install: >-
          base-devel
          mingw-w64-ucrt64-toolchain
          mingw-w64-ucrt64-cmake
          mingw-w64-ucrt64-raylib
          mingw-w64-ucrt64-enet
          zip

    - name: Compila il progetto con CMake
      shell: msys2 {0}
      run: |
        mkdir build
        cd build
        cmake -G "MinGW Makefiles" ..
        cmake --build .

    - name: Prepara i file per la release
      shell: bash
      run: |
        mkdir -p release_folder
        cp build/TinyTillers.exe release_folder/
        cp /ucrt64/bin/raylib.dll release_folder/
        cp /ucrt64/bin/libenet-7.dll release_folder/
        cp /ucrt64/bin/libgcc_s_seh-1.dll release_folder/
        cp /ucrt64/bin/libstdc++-6.dll release_folder/
        cp /ucrt64/bin/libwinpthread-1.dll release_folder/
        cp -r assets release_folder/
        cd release_folder && zip -r ../TinyTillers-Windows.zip *

    - name: Crea la Release su GitHub e carica lo ZIP
      uses: softprops/action-gh-release@v1
      with:
        files: TinyTillers-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}