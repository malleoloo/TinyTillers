name: Release Prebuilt Game

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: windows-latest

    steps:
    - name: Copia il codice del repository
      uses: actions/checkout@v4

    - name: Prepara i file per la release
      shell: bash
      run: |
        mkdir -p release_folder
        # Copia l'eseguibile dalla cartella build alla cartella di rilascio
        cp build/TinyTillers.exe release_folder/
        # Copia le DLL necessarie dalla radice del progetto
        cp libenet-7.dll release_folder/
        cp glfw3.dll release_folder/
        cp libgcc_s_seh-1.dll release_folder/
        cp libstdc++-6.dll release_folder/
        cp libwinpthread-1.dll release_folder/
        # Copia la cartella assets
        cp -r assets release_folder/
        cd release_folder && zip -r ../TinyTillers-Windows.zip *

    - name: Crea la Release su GitHub e carica lo ZIP
      uses: softprops/action-gh-release@v1
      with:
        files: TinyTillers-Windows.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}